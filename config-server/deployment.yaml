apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: petclinic-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: config-server

  template:
    metadata:
      labels:
        app: config-server

    spec:
      containers:
        - name: config-server
          image: 192.168.56.114/petclinic-microservice/spring-petclinic-config-server:71af386

          ports:
            - containerPort: 8888
              protocol: TCP

          resources:
            limits:
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
