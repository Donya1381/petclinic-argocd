
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-server
  namespace: petclinic-app
  labels:
    app: admin-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-server
  template:
    metadata:
      labels:
        app: admin-server
    spec:
      containers:
        - name: admin-server
          image: 192.168.56.108:30500/spring-petclinic-admin-server:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          resources:
            limits:
              memory: 512Mi

